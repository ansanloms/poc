name: deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: デプロイ先環境
        type: choice
        required: true
        options:
          - poc-dev
          - poc-stage
          - poc-prod
      memo:
        description: メモ (作業者・作業予定期間など、任意)
        type: string
        required: false
        default: ""

permissions:
  contents: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: https://ap-northeast-1.console.aws.amazon.com/s3/buckets/poc-deploy-${{ vars.AWS_ACCOUNT_ID }}?prefix=${{ steps.vars.outputs.short }}/
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      AWS_REGION: ap-northeast-1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve role and prefix from the environment name
        id: vars
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          short="${ENVIRONMENT#poc-}"
          {
            echo "short=${short}"
            echo "role_arn=arn:aws:iam::${ACCOUNT_ID}:role/gha-poc-deploy-${short}"
            echo "bucket=poc-deploy-${ACCOUNT_ID}"
          } >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ steps.vars.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Show assumed identity
        run: aws sts get-caller-identity

      - name: Build deploy marker
        env:
          SHORT: ${{ steps.vars.outputs.short }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MEMO: ${{ inputs.memo }}
        run: |
          {
            echo "environment=${SHORT}"
            echo "ref=${REF_NAME}"
            echo "sha=${SHA}"
            echo "actor=${ACTOR}"
            echo "run_url=${RUN_URL}"
            echo "deployed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "memo=${MEMO}"
          } > deployed.txt
          cat deployed.txt

      - name: Upload deploy marker to S3
        env:
          BUCKET: ${{ steps.vars.outputs.bucket }}
          SHORT: ${{ steps.vars.outputs.short }}
        run: aws s3 cp deployed.txt "s3://${BUCKET}/${SHORT}/deployed.txt"

      - name: Record memo as a git note
        env:
          SHORT: ${{ steps.vars.outputs.short }}
          SHA: ${{ github.sha }}
          MEMO: ${{ inputs.memo }}
        run: |
          set -euo pipefail
          notes_ref="deploy-${SHORT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          payload="$(MEMO="$MEMO" node -e 'process.stdout.write(JSON.stringify({memo: process.env.MEMO || ""}))')"
          git notes --ref="$notes_ref" add -f -m "$payload" "$SHA"
          git notes --ref="$notes_ref" show "$SHA"
          git push -f origin "refs/notes/${notes_ref}"

      - name: Write summary
        env:
          BUCKET: ${{ steps.vars.outputs.bucket }}
          SHORT: ${{ steps.vars.outputs.short }}
        run: |
          {
            echo "## deploy"
            echo ""
            echo "- environment: ${SHORT}"
            echo "- object: s3://${BUCKET}/${SHORT}/deployed.txt"
            echo ""
            echo '```'
            cat deployed.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
