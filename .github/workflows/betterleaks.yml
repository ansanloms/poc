name: betterleaks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BETTERLEAKS_VERSION: 1.8.1
      BETTERLEAKS_SHA256: efa407244e1ea8e35f582b8a42becdeac08bdead04f68eb752adda722d583c2a
    steps:
      - name: Checkout with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install betterleaks
        working-directory: ${{ runner.temp }}
        run: |
          archive="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 10 -o "${archive}" \
            "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/${archive}"
          echo "${BETTERLEAKS_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p betterleaks
          tar -xzf "${archive}" -C betterleaks
          echo "${RUNNER_TEMP}/betterleaks" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/betterleaks/betterleaks" version

      # --legacy-print prints the Fingerprint of each finding, which is needed
      # to suppress a false positive via .betterleaksignore.
      - name: Scan git history for secrets
        run: betterleaks git . --no-banner --redact -v --legacy-print
