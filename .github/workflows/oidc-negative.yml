name: oidc-negative

on:
  workflow_dispatch:

jobs:
  # Case: the job does not request an OIDC token (no id-token: write).
  no-id-token:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Try to assume the dev role without id-token permission
        id: assume
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gha-poc-deploy-dev
          aws-region: ap-northeast-1

      - name: Expect failure
        env:
          OUTCOME: ${{ steps.assume.outcome }}
        run: |
          echo "assume outcome: ${OUTCOME}"
          if [ "${OUTCOME}" != "failure" ]; then
            echo "expected the assume step to fail, but it did not" >&2
            exit 1
          fi

  # Case: the job runs in environment poc-dev but asks for the prod role.
  wrong-environment-role:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: poc-dev
    steps:
      - name: Try to assume the prod role from the poc-dev environment
        id: assume
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gha-poc-deploy-prod
          aws-region: ap-northeast-1

      - name: Expect failure
        env:
          OUTCOME: ${{ steps.assume.outcome }}
        run: |
          echo "assume outcome: ${OUTCOME}"
          if [ "${OUTCOME}" != "failure" ]; then
            echo "expected the assume step to fail, but it did not" >&2
            exit 1
          fi
